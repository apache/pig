name: CI

on:
  push:
    branches: ['**']

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 8 (OpenJDK 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Verify Java installation
        run: |
          export JRE_HOME=${JAVA_HOME}
          echo "JAVA_HOME: $JAVA_HOME"
          echo "JRE_HOME: $JRE_HOME"
          java -version

      - name: Build with Ant
        run: |
          export JRE_HOME=${JAVA_HOME}
          ant jar

      - name: Verify JAR was built
        run: |
          ls -la build/*.jar
          ls -la *.jar || true

  deploy:
    name: Deploy to JFrog
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 8 (OpenJDK 8)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Extract version from build.xml
        id: version
        run: |
          # Extract pig.version and pig.version.patch from build.xml
          PIG_MAJOR=$(grep -oP 'name="pig.version" value="\K[^"]+' build.xml)
          PIG_PATCH=$(grep -oP 'name="pig.version.patch" value="\K[^"]+' build.xml)
          PIG_VERSION="${PIG_MAJOR}.${PIG_PATCH}"
          echo "PIG_VERSION=${PIG_VERSION}" >> $GITHUB_ENV
          echo "Detected version: ${PIG_VERSION}"

      - name: Build with Ant
        run: |
          export JRE_HOME=${JAVA_HOME}
          ant jar

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        env:
          JF_URL: https://xplenty.jfrog.io
          JF_USER: ${{ secrets.JFROG_USERNAME }}
          JF_PASSWORD: ${{ secrets.JFROG_PASSWORD }}

      - name: Configure JFrog CLI
        run: |
          jf config add xplenty-artifactory \
            --url=https://xplenty.jfrog.io/artifactory \
            --user=${{ secrets.JFROG_USERNAME }} \
            --password=${{ secrets.JFROG_PASSWORD }} \
            --interactive=false

      - name: Deploy to staging
        if: github.ref == 'refs/heads/staging'
        run: |
          # Upload the main pig JAR
          jf rt upload \
            "build/pig-*.jar" \
            "sharelib-stg/org/apache/pig/pig/${PIG_VERSION}/" \
            --server-id=xplenty-artifactory \
            --flat=false
          
          # Also upload the root-level JAR if it exists
          if [ -f "pig-${PIG_VERSION}.jar" ]; then
            jf rt upload \
              "pig-${PIG_VERSION}.jar" \
              "sharelib-stg/org/apache/pig/pig/${PIG_VERSION}/" \
              --server-id=xplenty-artifactory
          fi

      - name: Deploy to production
        if: github.ref == 'refs/heads/master'
        run: |
          # Upload the main pig JAR
          jf rt upload \
            "build/pig-*.jar" \
            "sharelib/org/apache/pig/pig/${PIG_VERSION}/" \
            --server-id=xplenty-artifactory \
            --flat=false
          
          # Also upload the root-level JAR if it exists
          if [ -f "pig-${PIG_VERSION}.jar" ]; then
            jf rt upload \
              "pig-${PIG_VERSION}.jar" \
              "sharelib/org/apache/pig/pig/${PIG_VERSION}/" \
              --server-id=xplenty-artifactory
          fi
